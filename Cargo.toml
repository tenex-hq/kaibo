[workspace]
resolver = "2"
members = ["crates/kaibo-core", "crates/kaibo"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tenex-hq/kaibo"

[workspace.dependencies]
kaibo-core = { path = "crates/kaibo-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
regex = "1"

# Optional, and behind the `otlp` feature: see ADR 0016 and issue #69. The
# blocking HTTP path is chosen deliberately over `grpc-tonic`, which would
# pull tonic and tokio in explicitly; `main` stays synchronous either way.
opentelemetry = { version = "0.33", default-features = false, features = ["logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
    "logs",
    "http-proto",
    "reqwest-blocking-client",
] }

[profile.release]
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
