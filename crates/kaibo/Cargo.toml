[package]
name = "kaibo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "kaibo: a typed CLI interface to a git-backed markdown knowledge corpus, for AI coding agents."

[[bin]]
name = "kaibo"
path = "src/main.rs"

[features]
# Passthrough, so `cargo build -p kaibo --features otlp` is the whole story
# for someone building a binary that exports.
otlp = ["kaibo-core/otlp"]

[dependencies]
kaibo-core = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
