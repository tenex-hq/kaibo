[package]
name = "kaibo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for kaibo: config resolution, frontmatter model, output and error contracts."

[lib]
name = "kaibo_core"
path = "src/lib.rs"

[features]
# Off for `cargo build`, on for every release binary (dist-workspace.toml,
# ADR 0018). Compiled in, it still sends nothing until `otlp_endpoint` names
# a collector. The JSONL trail is unconditional.
otlp = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]

[dependencies]
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tempfile = "3"
