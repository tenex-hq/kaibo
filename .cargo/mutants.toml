# cargo-mutants configuration.
#
# The only mutation testing that runs is the per-PR `--in-diff` gate in CI:
# it already bounds cost to the lines a PR touched, so a hand-curated
# per-file allowlist here would buy no speed and would only drift - a file
# added to the trust-critical surface and never added to this list would
# silently never be gated. examine_globs instead draws the boundary at the
# crate seam: the whole kaibo-core library, where every guarantee in
# AGENTS.md actually lives, and never the thin `kaibo` binary crate, whose
# tests are a separate suite additional_cargo_test_args below does not run.
examine_globs = ["crates/kaibo-core/**"]

# Every mutant here lives in kaibo-core; scoping the test run to that one
# package (rather than the whole workspace) skips rebuilding and running
# the kaibo binary crate's end-to-end suite for every mutant, and keeps the
# tests run in sync with examine_globs above - mutating a file whose tests
# live in a different package would produce a mutant nothing here catches.
#
# `--features otlp` because a `#[cfg(feature = ...)]` module that is not
# compiled is not mutated either: every mutant in `trail/otlp.rs` would be
# reported as missed, on code the run never built.
additional_cargo_test_args = ["--package", "kaibo-core", "--features", "otlp"]

# A generous floor under cargo-mutants' own auto-detected timeout, so a
# mutant that spins rather than fails fast does not stall the whole run.
minimum_test_timeout = 60
